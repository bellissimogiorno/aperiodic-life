name: Deploy Pages (manual)

# Creating or updating the repository never publishes the site automatically.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Verify and build the static site
    # Only the default branch can supply a deployment artefact.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run standard checks
        run: python3 tools/project.py test standard 2>&1 | tee "$RUNNER_TEMP/pages-checks.log"
      - name: Retain failed verification logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-check-logs
          path: ${{ runner.temp }}/pages-checks.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build the curated static payload
        run: python3 tools/build_site.py --output-dir "$RUNNER_TEMP/aperiodic-life-site"
      - name: Upload the Pages artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/aperiodic-life-site
          # The curated output contains only one hidden file: .nojekyll.
          include-hidden-files: true

  deploy:
    name: Publish the verified static site
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
